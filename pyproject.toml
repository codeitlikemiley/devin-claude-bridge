[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devin-claude-bridge"
version = "0.1.0"
description = "Multi-account Devin inbox and MCP stdio bridge for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "httpx>=0.27,<1", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
devin-claude-bridge = "devin_claude_bridge.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
